name: Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # A release signed with any other key would not install over the app on the phone.
      REQUIRE_RELEASE_KEY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Repository secrets (Settings → Secrets and variables → Actions):
      #   RELEASE_KEYSTORE_BASE64   contents of videostudio-release.jks.base64.txt
      #   RELEASE_KEYSTORE_PASSWORD the password from SIGNING-KEY-README.txt
      #   RELEASE_KEY_ALIAS         videostudio
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing RELEASE_KEYSTORE_BASE64 secret. See android/README.md (Updates)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the signed APK
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Check it installs over the app (same key)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          SHA=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signed with $SHA"
          [ "$SHA" = "2b18af1117d2e064e5c52e4c4272cb9471658ec4ea3804a4e46432c4f60d6c14" ] || { echo "::error::Wrong signing key"; exit 1; }
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          NAME=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          CODE=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          cp "$APK" "VideoStudio-$NAME-$CODE.apk"
          echo "APK_NAME=VideoStudio-$NAME-$CODE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: android/VideoStudio-*.apk
